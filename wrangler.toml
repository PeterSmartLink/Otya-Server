name = "otya-core"
main = "src/production-router.mjs"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false
routes = [
  { pattern = "petersmartlink.com", custom_domain = true },
  { pattern = "www.petersmartlink.com", custom_domain = true },
  { pattern = "docs.petersmartlink.com", custom_domain = true },
  { pattern = "status.petersmartlink.com", custom_domain = true },
  { pattern = "space.petersmartlink.com", custom_domain = true }
]

[observability]
enabled = true
redact_query_string = true
[observability.logs]
enabled = true
head_sampling_rate = 0.25
[observability.traces]
enabled = true
head_sampling_rate = 0.05

[vars]
ENVIRONMENT = "production"
APP_NAME    = "OTYA"
WEBSITE_URL = "https://petersmartlink.com"
ADMIN_REPORT_EMAIL = "petersmartlink@gmail.com"
FIREBASE_PROJECT_ID = "otya-player"
FIREBASE_PROJECT_NUMBER = "82776565585"
FIREBASE_ANDROID_APP_ID = "1:82776565585:android:085cf9b4eecb76e9535570"
ANDROID_PACKAGE_NAME = "com.otyaplayer.app"
FIREBASE_APP_CHECK_MODE = "monitor"
ADMIN_EMAILS = "petersmartlink@gmail.com"
RESEND_WEBHOOK_ID = "ed1c9372-22ec-4f85-931d-14826a07b3cb"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[secrets_store_secrets]]
binding = "TELEGRAM_BOT_TOKEN"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "TELEGRAM_BOT_TOKEN"

[[secrets_store_secrets]]
binding = "TELEGRAM_WEBHOOK_SECRET"
store_id = "a1df6b906c6e4c1da6e7687330ea0f9c"
secret_name = "TELEGRAM_WEBHOOK_SECRET"

[[r2_buckets]]
binding     = "R2"
bucket_name = "otya-player-releases"

[[kv_namespaces]]
binding = "KV"
id      = "3f179286e0fc4dbfa2332884cdf81312"

[[d1_databases]]
binding       = "DB"
database_name = "otya-store-db"
database_id   = "ab157fc6-2cbb-4d46-9789-2e4392e16aea"

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "otya-core-analytics"
[[analytics_engine_datasets]]
binding = "OTYA_ANALYTICS"
dataset = "otya_system_analytics"

[[unsafe.bindings]]
type         = "ratelimit"
name         = "RATE_LIMITER"
namespace_id = "1001"
  [unsafe.bindings.simple]
  limit  = 60
  period = 60

[[queues.producers]]
binding = "PUSH_QUEUE"
queue   = "otya-push"
[[queues.consumers]]
queue             = "otya-push"
max_batch_size    = 10
max_retries       = 3
dead_letter_queue = "otya-push-dlq"

[[queues.producers]]
binding = "AI_QUEUE"
queue   = "otya-next-jobs"

# Do not attach otya-release-events here yet. The dedicated idempotent release
# intake handler must land and pass tests before the R2 event queue gets a consumer.

[[services]]
binding = "AUTH"
service = "otya-auth"
[[services]]
binding = "AI_SUPPORT"
service = "otya-next"

[[workflows]]
name = "otya-release"
binding = "OTYA_RELEASE_WORKFLOW"
class_name = "OtyaReleaseWorkflow"

[triggers]
crons = ["*/5 * * * *", "0 * * * *"]